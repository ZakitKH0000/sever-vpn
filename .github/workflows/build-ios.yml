name: Build Sever IPA
on:
  workflow_dispatch:
  push:
    paths: ['ios/**', 'Packages/**', 'scripts/**', 'tests/**', 'project.yml', 'package.json', '.github/workflows/build-ios.yml']
  pull_request:
permissions:
  contents: read
concurrency:
  group: sever-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test configuration processing
        run: npm test
      - name: Verify JavaScriptCore compatibility
        run: swift scripts/check_javascriptcore.swift
      - name: Prepare fresh first-launch server list
        run: node scripts/prepare_catalog.cjs
      - name: Prepare pinned Xray framework
        run: python3 scripts/prepare_dependencies.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Test real app startup and catalog failures on iPhone simulator
        run: python3 scripts/run_simulator_tests.py
      - name: Archive unsigned iPhone application
        run: |
          set -o pipefail
          xcodebuild archive -project Sever.xcodeproj -scheme Sever \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Sever.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' | tee build-xcode.log
      - name: Package IPA for user's signing tool
        run: python3 scripts/package_ipa.py build/Sever.xcarchive build/Sever-unsigned.ipa
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sever-unsigned-IPA
          path: build/Sever-unsigned.ipa
          retention-days: 1
          if-no-files-found: error
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sever-build-log
          path: |
            build-xcode.log
            build-simulator.log
          retention-days: 1
